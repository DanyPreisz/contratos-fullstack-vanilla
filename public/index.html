<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contratos</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Practica</p>
      <h1>Contratos</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">No es un documento legal</p><h1>Contratos</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <div class="layout">
        <form id="contract-form" class="card form">
          <input id="title" placeholder="Titulo" maxlength="60" />
          <input id="partyA" placeholder="Parte A" maxlength="80" required />
          <input id="partyB" placeholder="Parte B" maxlength="80" required />
          <input id="day" type="date" required />
          <input id="amount" type="number" min="0" value="0" />
          <textarea id="object" placeholder="Objeto" maxlength="400" required></textarea>
          <button class="primary" type="submit">Guardar</button>
        </form>
        <article id="preview" class="card preview"></article>
      </div>
      <p id="form-error" class="error" hidden></p>
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
